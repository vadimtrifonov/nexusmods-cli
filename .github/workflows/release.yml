name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must have the form v1.2.3." }
          [xml] $project = Get-Content 'src/NexusMods/NexusMods.csproj'
          if ([string] $project.Project.PropertyGroup.Version -ne $tag.Substring(1)) {
            throw 'Project version does not match release tag.'
          }

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run tests
        run: mise run test

      - name: Build release archive
        run: mise run publish

      - name: Smoke-test published executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & "artifacts/nexusmods-$version-win-x64/nexusmods.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Published executable smoke test failed.' }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          gh release create $tag "artifacts/nexusmods-$version-win-x64.zip" --verify-tag --title $tag --generate-notes
